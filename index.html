<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons & manifest -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/realpng.png" />
    <link rel="apple-touch-icon" href="/onlylogo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme -->
    <meta name="theme-color" content="#040D1A" />
    <meta name="color-scheme" content="light dark" />

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts — display=swap for non-blocking -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Default title & description (overridden per-page by react-helmet-async) -->
    <title>MellowMoon SoftTech Pvt Ltd — Engineering Software. Empowering Business.</title>
    <meta
      name="description"
      content="MellowMoon SoftTech builds AI-powered software, web & mobile apps, CRM, inventory and business platforms for SMEs — and trains the next generation of engineers in Nanded, Maharashtra."
    />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Nanded, Maharashtra, India" />

    <!-- Default Open Graph (overridden per-page by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MellowMoon SoftTech Pvt Ltd" />
    <meta property="og:title" content="MellowMoon SoftTech Pvt Ltd" />
    <meta property="og:description" content="Professional Software Development Company — AI-powered software, web &amp; mobile apps, CRM and business platforms for SMEs." />
    <meta property="og:url" content="https://www.mellowmoonsofttech.com/" />
    <meta property="og:image" content="https://www.mellowmoonsofttech.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Default Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mellowmoonsofttech" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
